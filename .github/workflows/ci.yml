name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master
  # Twice a month, so a new toolchain or a dependency's release shows up while nothing is pushed.
  schedule:
    - cron: "45 2 1,16 * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      # Every decision broken once has to turn a test red; the script exits 1 when one does not.
      - name: every decision is caught by a test when broken
        if: runner.os == 'Linux'
        run: python3 scripts/check_mutations.py

      # The first gradient rule's vectors are Netflix concurrency-limits' own answers; a stale
      # file means the replay compares against something the reference no longer says.
      - name: the first gradient rule's vectors are the reference's current output
        if: runner.os == 'Linux'
        run: |
          cd scripts/gen_vectors/min_rtt
          base=https://repo1.maven.org/maven2
          curl -fsSL -o core.jar "$base/com/netflix/concurrency-limits/concurrency-limits-core/0.5.4/concurrency-limits-core-0.5.4.jar"
          curl -fsSL -o slf4j-api.jar "$base/org/slf4j/slf4j-api/2.0.16/slf4j-api-2.0.16.jar"
          javac -d "$RUNNER_TEMP/classes" -cp core.jar:slf4j-api.jar MinRttVectors.java
          java -cp "$RUNNER_TEMP/classes:core.jar:slf4j-api.jar" MinRttVectors 2>/dev/null > ../../../src/min_rtt_vectors_wbtest.mbt
          rm core.jar slf4j-api.jar
          cd ../../..
          moon fmt
          git diff --exit-code src/min_rtt_vectors_wbtest.mbt
